name: hyvora-degree

# ==========================================
# HYVORA Degree College EduERP - Production Docker Compose
# Architecture: Next.js Frontend + NestJS Backend -> Dedicated Supabase PostgreSQL & Storage
# Coexists cleanly with Academy EduERP (ports 3001/3002 vs 3003/3004)
# ==========================================

services:
  # ----------------------------------------
  # Degree College NestJS Backend API Service
  # ----------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hyvora-degree-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3002
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3003,https://degree.hyvora.in,https://*.degree.hyvora.in,https://*.hyvora.in
      - ENABLE_SWAGGER=true
    ports:
      - "3004:3002"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3002/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - hyvora-degree-network

  # ----------------------------------------
  # Degree College Next.js Frontend Web Application Service
  # ----------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3004/api/v1
    container_name: hyvora-degree-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NEXT_PUBLIC_API_URL=http://localhost:3004/api/v1
    ports:
      - "3003:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hyvora-degree-network

# ----------------------------------------
# Isolated Degree College Application Network Bridge
# ----------------------------------------
networks:
  hyvora-degree-network:
    driver: bridge

