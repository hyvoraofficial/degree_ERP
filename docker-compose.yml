# ==========================================
# HYVORA EduERP - Production Docker Compose
# Architecture: Next.js Frontend + NestJS Backend -> Supabase PostgreSQL & Storage
# ==========================================

services:
  # ----------------------------------------
  # NestJS Backend API Service
  # ----------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hyvora-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3002
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001,http://localhost:3002,https://hyvorademo.in,https://*.hyvora.in
      - ENABLE_SWAGGER=true
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3002/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - hyvora-network

  # ----------------------------------------
  # Next.js Frontend Web Application Service
  # ----------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3002/api/v1
    container_name: hyvora-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NEXT_PUBLIC_API_URL=http://localhost:3002/api/v1
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hyvora-network

# ----------------------------------------
# Isolated Application Network Bridge
# ----------------------------------------
networks:
  hyvora-network:
    driver: bridge
